{% extends "layouts/base.html" %}
{% block title %}Delete Permission{% endblock %}
{% block page_title %}Delete Permission{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle"></i>
                <h1 class="h5 mb-0">Confirm Delete</h1>
            </div>
            <div class="card-body p-4">
                <p>Are you sure you want to delete permission <strong>{{ permission.code }}</strong>?</p>
                <form method="POST" class="d-flex gap-2 pt-2">
                    {{ form.hidden_tag() }}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                    <a href="{{ url_for('permissions.detail', permission_id=permission.id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
