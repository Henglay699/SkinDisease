{% extends "layouts/base.html" %}
{% block title %}Symptom Detail{% endblock %}
{% block page_title %}Symptom Detail{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="mb-0">Symptom: "{{ fact.symptom }}"</h1>
    <div class="d-flex gap-2">
        <a href="{{ url_for('facts.edit', fact_id=fact.id) }}" class="btn btn-warning">
            <i class="bi bi-pencil"></i> Edit
        </a>
        <a href="{{ url_for('facts.index') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body p-4">
        <p><strong>Symptom:</strong> {{ fact.symptom }}</p>
        <p class="mb-0"><strong>Description:</strong> {{ fact.description or '-' }}</p>
    </div>
</div>
{% endblock %}
